&lt;html lang=&quot;zh-CN&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1,viewport-fit=cover&quot;&gt;
&lt;title&gt;JFT Delivery OS · Demo&lt;/title&gt;

&lt;style&gt;
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Microsoft Yahei&quot;,Arial,sans-serif;color:#182639;background:#f3f6fa}

.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.card{background:white;border:1px solid #e1e7ef;border-radius:14px;box-shadow:0 2px 10px #102b4609;padding:15px}

.stopmain{flex:1;min-width:0}.stopmain b{font-size:14px}.stopmeta{font-size:11px;color:#6f7e91;margin-top:3px}.tag{display:inline-block;font-size:10px;font-weight:800;padding:4px 7px;border-radius:100px;background:#edf2f8;color:#536277}.tag.green{background:#dff6e9;color:#0f7450}.tag.orange{background:#fff0d7;color:#96600d}.tag.blue{background:#e2f2ff;color:#1a67a3}.tag.red{background:#fae7e6;color:#b23e3e}

#map{height:min(68vh,700px);min-height:430px;border-radius:11px;z-index:1;background:#e7edf3}.map-panel{padding:10px}.map-note{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px;color:#66798b;font-size:11px}.legend{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.detail{margin-top:11px;padding:12px;border:1px solid #e0e8f1;border-radius:11px;background:#fbfdff}.detail h3{margin:0 0 7px;font-size:15px}.detail p{margin:5px 0;font-size:12px;color:#566d81}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid #e1e7ef;padding:12px;border-radius:12px}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#708092}
.driver-grid{display:grid;grid-template-columns:minmax(280px,500px) minmax(310px,1fr);gap:14px}.driver-stop{padding:11px 12px;border:1px solid #dfebf4;border-radius:10px;margin:10px 0}.driver-stop.current{border:2px solid #3387c4;background:#f2faff}.item-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #e8edf4}.item-desc{font-size:12px;color:#6e8091;margin-top:2px}
.mode{display:flex;gap:5px;background:#edf2f8;border-radius:10px;padding:4px}.mode button{background:transparent;color:#5b6f80;font-size:13px;flex:1}.mode button.on{background:#fff;color:#155f9e;box-shadow:0 1px 4px #18345016}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.2px;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.label-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:14px}.sticker{border-left:7px solid #269b78;background:#fff;border-radius:3px;outline:1px solid #e2e2e2;padding:8px;display:flex;justify-content:space-between;gap:5px;min-height:88px}.sticker small{font-size:8px}.sticker .name{font-size:15px;font-weight:900;margin:3px 0}.sticker .item{font-size:11px;font-weight:700}.sticker .piece{font-size:20px;font-weight:900;margin-top:7px}.qr{width:63px;height:63px;flex-shrink:0}.qr canvas,.qr img{width:63px!important;height:63px!important}
.log{padding:9px 2px;border-bottom:1px solid #e3eaf2;font-size:13px}.log small{color:#7790a0;font-size:11px}
.modal{position:fixed;inset:0;background:#061a2e88;display:none;align-items:center;justify-content:center;z-index:1100;padding:15px}.modal.show{display:flex}.modal-inner{width:min(550px,100%);max-height:85vh;overflow:auto;background:white;border-radius:15px;padding:20px}.modal h2{margin:0 0 14px;font-size:19px}
#camView{max-width:100%;display:none;margin-top:10px;border-radius:10px;width:100%;max-height:260px;object-fit:cover}

@page{size:letter;margin:0}
@media print{body *{visibility:hidden!important}#printArea,#printArea *{visibility:visible!important}#printArea{display:block!important;position:absolute;left:0;top:0;width:8.5in} .print-page{width:8.5in;height:11in;padding:.5in .1875in;display:grid;grid-template-columns:repeat(3,2.625in);grid-template-rows:repeat(10,1in);column-gap:.125in;page-break-after:always;break-after:page}.print-label{overflow:hidden;border-left:0.1in solid #269b78;padding:.03in .045in;font-family:Arial,sans-serif}.print-label .sticker{outline:none;border:0;padding:0;min-height:0;height:.92in}.print-label .name{font-size:10pt}.print-label .item{font-size:7pt}.print-label .piece{font-size:15pt}.print-label .qr{width:.65in;height:.65in}.print-label .qr canvas,.print-label .qr img{width:.65in!important;height:.65in!important}.print-page:last-child{page-break-after:auto;break-after:auto}}

&lt;body&gt;&lt;header&gt;&lt;div class=&quot;brand&quot;&gt;JFT Delivery OS &lt;small&gt;Food Distribution · 调度 / 司机 / 扫码 / 标签&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;demo-pill&quot;&gt;可操作 Demo · 本机模拟数据&lt;/span&gt;&lt;/header&gt;
&lt;nav&gt;&lt;button class=&quot;active&quot; data-page=&quot;dispatch&quot;&gt;◉ 仓库调度地图&lt;/button&gt;&lt;button data-page=&quot;driver&quot;&gt;▣ 司机端&lt;/button&gt;&lt;button data-page=&quot;scan&quot;&gt;▦ 扫码 / 标签&lt;/button&gt;&lt;button data-page=&quot;import&quot;&gt;↻ 联合出单表 / 加单&lt;/button&gt;&lt;/nav&gt;
&lt;main&gt;
&lt;section id=&quot;dispatch&quot; class=&quot;page active&quot;&gt;
 &lt;div class=&quot;topline&quot;&gt;&lt;div&gt;&lt;h1&gt;仓库交互调度地图&lt;/h1&gt;&lt;div class=&quot;subtitle&quot;&gt;可选择线路、调整客户顺序、模拟加单、发布路线；地图坐标均为演示位置。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;optBtn&quot;&gt;智能排序（演示）&lt;/button&gt;&lt;button class=&quot;primary&quot; id=&quot;publishBtn&quot;&gt;发布到司机端&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;stats&quot;&gt;&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;stStops&quot;&gt;0&lt;/b&gt;&lt;span&gt;总配送站点&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;stPieces&quot;&gt;0&lt;/b&gt;&lt;span&gt;标签件数&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;stDone&quot;&gt;0&lt;/b&gt;&lt;span&gt;已完成站点&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;stat&quot;&gt;&lt;b id=&quot;stNew&quot;&gt;0&lt;/b&gt;&lt;span&gt;待装车 / 新加单&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;dashboard&quot;&gt;&lt;div class=&quot;card sidebar&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;&lt;span&gt;配送站点&lt;/span&gt;&lt;span id=&quot;routeCount&quot; class=&quot;tag&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;筛选路线&lt;/label&gt;&lt;select id=&quot;routeFilter&quot;&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;compact ghost&quot; id=&quot;addStopBtn&quot;&gt;＋ 新增站点&lt;/button&gt;&lt;button class=&quot;compact warn&quot; id=&quot;simulateBtn&quot;&gt;＋ 模拟加单&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;notice&quot;&gt;客户顺序支持 ↑ ↓ 调整或拖动。已完成的站点不会因排序或新订单被清除。&lt;/div&gt;&lt;div id=&quot;stopList&quot;&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card map-panel&quot;&gt;&lt;div id=&quot;map&quot;&gt;&lt;/div&gt;&lt;div class=&quot;map-note&quot;&gt;&lt;span class=&quot;legend&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#297ccc&quot;&gt;&lt;/span&gt;DM&lt;/span&gt;&lt;span class=&quot;legend&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#12a774&quot;&gt;&lt;/span&gt;Downtown&lt;/span&gt;&lt;span class=&quot;legend&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:#eb8e3c&quot;&gt;&lt;/span&gt;Bedford&lt;/span&gt;&lt;span&gt;虚线/连接线为示意直线，非实际导航道路。&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;selectedDetail&quot; class=&quot;detail&quot;&gt;&lt;h3&gt;点击客户查看详情&lt;/h3&gt;&lt;p&gt;地图上客户标记和左侧列表均可点击。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;driver&quot; class=&quot;page&quot;&gt;
 &lt;div class=&quot;topline&quot;&gt;&lt;div&gt;&lt;h1&gt;司机配送手机端&lt;/h1&gt;&lt;div class=&quot;subtitle&quot;&gt;演示扫码、导航、签收和配送进度。&lt;/div&gt;&lt;/div&gt;&lt;select id=&quot;driverRoute&quot;&gt;&lt;/select&gt;&lt;/div&gt;
 &lt;div class=&quot;driver-grid&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;&lt;span&gt;我的配送路线&lt;/span&gt;&lt;span id=&quot;driverCounts&quot; class=&quot;tag blue&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;compact btn&quot; id=&quot;sendGps&quot;&gt;发送当前位置（一次）&lt;/button&gt;&lt;button class=&quot;compact ghost&quot; id=&quot;driverRefresh&quot;&gt;刷新&lt;/button&gt;&lt;/div&gt;&lt;p class=&quot;subtitle&quot;&gt;定位只有点击后上报一次；不是后台持续GPS。&lt;/p&gt;&lt;div id=&quot;driverStops&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;&lt;span&gt;当前客户详情&lt;/span&gt;&lt;span class=&quot;tag&quot; id=&quot;driverBadge&quot;&gt;未选择&lt;/span&gt;&lt;/div&gt;&lt;div id=&quot;driverDetail&quot;&gt;&lt;p&gt;请在左侧选择一个客户。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;scan&quot; class=&quot;page&quot;&gt;
 &lt;div class=&quot;topline&quot;&gt;&lt;div&gt;&lt;h1&gt;标签 &amp; 上下货扫码&lt;/h1&gt;&lt;div class=&quot;subtitle&quot;&gt;每件货物都有唯一编号；扫码装车和卸货使用相同编号。&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;primary&quot; id=&quot;printBtn&quot;&gt;打印当前路线标签&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;扫码工作台&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;操作路线&lt;/label&gt;&lt;select id=&quot;scanRoute&quot;&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;mode&quot;&gt;&lt;button id=&quot;loadMode&quot; class=&quot;on&quot;&gt;扫码上车&lt;/button&gt;&lt;button id=&quot;deliverMode&quot;&gt;扫码下货&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;field&quot; style=&quot;margin-top:12px&quot;&gt;&lt;label&gt;扫描结果 / 手动输入标签编号&lt;/label&gt;&lt;input id=&quot;scanCode&quot; placeholder=&quot;例如 JFT-S102-001&quot; class=&quot;code&quot;&gt;&lt;/div&gt;&lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;primary&quot; id=&quot;confirmScan&quot;&gt;确认扫码&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;startCamera&quot;&gt;打开相机扫码&lt;/button&gt;&lt;button class=&quot;ghost&quot; id=&quot;stopCamera&quot; style=&quot;display:none&quot;&gt;关闭相机&lt;/button&gt;&lt;/div&gt;&lt;video id=&quot;camView&quot; autoplay playsinline muted&gt;&lt;/video&gt;&lt;div class=&quot;notice&quot; id=&quot;scanHint&quot;&gt;支持手动输入和扫码；如浏览器不支持摄像头二维码识别，可以使用编号测试。&lt;/div&gt;&lt;div id=&quot;scanHistory&quot;&gt;&lt;/div&gt;&lt;/div&gt;
 &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;标签打印预览 &lt;span class=&quot;tag&quot; id=&quot;labelCount&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;显示路线&lt;/label&gt;&lt;select id=&quot;labelRoute&quot;&gt;&lt;/select&gt;&lt;/div&gt;&lt;p class=&quot;subtitle&quot;&gt;打印沿用 Avery 5160/8160（Letter，每页30张）。以下为屏幕缩略预览，缺货不自动视为已装车。&lt;/p&gt;&lt;div id=&quot;labelPreview&quot; class=&quot;label-list&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;/section&gt;
&lt;section id=&quot;import&quot; class=&quot;page&quot;&gt;
 &lt;div class=&quot;topline&quot;&gt;&lt;div&gt;&lt;h1&gt;联合出单表同步测试&lt;/h1&gt;&lt;div class=&quot;subtitle&quot;&gt;当前 Demo 为粘贴导入/手动模拟，不会读取或写入真实 Google Sheet。&lt;/div&gt;&lt;/div&gt;&lt;button class=&quot;danger compact&quot; id=&quot;resetBtn&quot;&gt;重置 Demo 数据&lt;/button&gt;&lt;/div&gt;
 &lt;div class=&quot;two&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;section-title&quot;&gt;粘贴联合出单表&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;导入到指定路线&lt;/label&gt;&lt;select id=&quot;importRoute&quot;&gt;&lt;/select&gt;&lt;/div&gt;&lt;div class=&quot;field&quot;&gt;&lt;label&gt;从表格复制列：序号 / 商家名称 / 产品名称 / 规格 / 数量 / 价格 / Sales&lt;/label&gt;&lt;textarea id=&quot;pasteArea&quot; placeholder=&quot;序号&amp;#9;商家名称&amp;#9;产品名称&amp;#9;规格&amp;#9;数量&amp;#9;价格&amp;#9;Sales&amp;#10;1&amp;#9;Sea Smoke&amp;#9;Green Pepper XXL&amp;#9;10KG&amp;#9;2 cs&amp;#9;&amp;#9;&quot;&gt;&lt;/textarea&gt;&lt;/div&gt;&lt;div class=&quot;controls&quot;&gt;&lt;button class=&quot;primary&quot; id=&quot;previewImportBtn&quot;&gt;导入 / 识别新增商品&lt;/button&gt;&lt;button class=&quot;ghost&quot; id=&quot;samplePasteBtn&quot;&gt;填入示例&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;notice&quot;&gt;示范版按单条路线的 7 列 TSV 解析，追加或增加数量，不覆盖已扫码和已签收的记录。正式版会自动同步并处理减少、取消、改单与版本审计。&lt;/div&gt;&lt;/div&gt;
