<style>
:root{--green:#086a47;--deep:#084d36;--bg:#f2f5f3;--ink:#122820;--line:#d6e2db;--muted:#668075;--soft:#e9f5ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:12px 16px;background:#e4eee7;color:#17543d;font-weight:700}button:disabled{opacity:.55;cursor:wait}.primary{background:var(--green);color:#fff}.warn{background:#fff0e5;color:#8d4200}.danger{background:#ffebea;color:#a52a26}.outline{border:1px solid #bfd1c5;background:#fff}.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:13px}input,select,textarea{width:100%;border:1px solid #c5d5cb;background:#fff;border-radius:10px;padding:12px;color:var(--ink)}label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}.page{max-width:1240px;margin:auto;padding:18px}.top{background:#fff;border-bottom:1px solid var(--line)}.topin{max-width:1240px;margin:auto;padding:13px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:900;font-size:20px;letter-spacing:-.5px;color:var(--deep)}.brand span{color:#8aa44c}.meta{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#e5f1eb;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 4px 16px rgba(4,42,22,.035)}.headrow{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.list{max-height:72vh;overflow-y:auto;margin-top:9px}.entry{display:flex;align-items:center;justify-content:space-between;gap:9px;width:100%;text-align:left;background:#fff;border-bottom:1px solid #e8eee9;border-radius:6px;padding:10px 8px}.entry.active{background:#e7f4eb}.entry strong{display:block;font-size:13px;overflow-wrap:anywhere}.entry small{color:var(--muted);display:block}.stamp{white-space:nowrap;font-size:11px;color:#fff;background:#959f9a;border-radius:20px;padding:3px 7px}.stamp.done{background:#0a8355}.stamp.zero{background:#b36b32}.cardtitle{font-size:24px;line-height:1.24;font-weight:850;overflow-wrap:anywhere;margin:7px 0}.desc{color:#617569;font-size:14px;margin-bottom:15px}.inputrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.7fr);gap:10px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1}.foto{border:2px dashed #bfd3c5;border-radius:12px;background:#f8fbf9;padding:18px;text-align:center;margin:16px 0}.foto .camera{font-size:30px}.foto .links{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}.foto button{font-size:13px}.thumbnails{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}.thumb{width:126px}.thumb img{width:126px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.thumb button{font-size:11px;padding:6px;width:100%}.counter{display:flex;gap:9px;flex-wrap:wrap;margin:9px 0}.stat{padding:10px;background:#f1f7f2;border-radius:10px;flex:1;text-align:center;min-width:80px}.stat b{font-size:23px;display:block}.bar{background:#e7ede8;border-radius:20px;height:9px;overflow:hidden}.bar div{height:100%;background:#14875c;transition:width .2s}.alert{padding:11px 13px;background:#fff1e5;color:#995000;border-radius:10px;font-size:13px}.msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#173a2b;color:white;padding:12px 20px;border-radius:10px;z-index:200;box-shadow:0 5px 30px #0003;max-width:95vw}.login{max-width:430px;margin:9vh auto}.hidden{display:none!important}.right{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.hist{max-width:210px;padding:8px;font-size:12px}.divider{height:1px;background:var(--line);margin:14px 0}.flex{display:flex;gap:8px;align-items:center;justify-content:space-between}.note{margin-top:12px}.photo-label{font-size:12px;color:#516f59;margin:4px 0}.desktopOnly{display:block}@media(max-width:820px){.page{padding:10px}.layout{display:flex;flex-direction:column}.panel{width:100%;padding:14px}.list{max-height:200px}.cardtitle{font-size:22px}.desktopOnly{display:none}.topin{padding:11px}.inputrow{grid-template-columns:1.1fr .8fr .7fr}.hist{max-width:160px}}

</head><body><div class="top"><div class="topin"><div class="brand">JFT <span>Food Distribution</span> <span class="tiny muted">· Fresh Count</span></div><div class="right"><span id="headerInfo" class="tiny muted">独立盘点 · 不写回联合出单表</span><button id="changePinBtn" class="outline hidden" style="padding:7px 11px" onclick="changePin()">修改口令</button><button id="logout" class="outline hidden" style="padding:7px 11px" onclick="logout()">退出</button></div></div></div>
<div id="login" class="page"><div class="panel login"><h2>🥬 蔬菜库存盘点</h2><p class="muted small">逐项盘点 · 拍照留档 · Excel / 12项每页 PDF</p><label>仓库访问口令</label><input id="pin" type="password" placeholder="输入仓库口令" autocomplete="off"><button class="primary" style="width:100%;margin-top:12px" onclick="login()">进入盘点系统</button><div id="loginError" class="alert hidden" style="margin-top:12px"></div></div></div>
<div id="app" class="page hidden"><div class="panel" style="margin-bottom:14px"><div class="headrow"><div><b id="sessionTitle">当前盘点</b><div class="muted tiny" id="sessionSub"></div></div><div class="right"><select id="batchHistory" class="hist" onchange="chooseHistory(this.value)"></select><button class="outline" onclick="reloadState()">刷新</button><button class="outline" onclick="startBatch(true)">新一轮</button></div></div><div id="startPanel" class="hidden" style="margin-top:12px"><label>盘点人 Rep</label><input id="rep" placeholder="例如：Hu"><button class="primary" style="margin-top:9px;width:100%" onclick="startBatch(false)">开始第一轮盘点</button></div><div id="stats" class="counter"></div><div class="bar"><div id="progress" style="width:0"></div></div><div class="actions" style="margin-top:12px"><button class="primary" onclick="exportPDF()">📷 汇总＋照片 PDF</button><button class="outline" onclick="exportTablePDF()">📄 仅表格 PDF</button><button class="outline" onclick="exportExcel()">📊 导出 Excel</button></div></div><div class="layout"><div class="panel"><div class="headrow"><b>商品清单</b><span class="muted tiny" id="itemTotal"></span></div><input id="search" placeholder="🔎 模糊搜索名称、品牌、中文、规格" style="margin-top:11px" oninput="renderList()"><div class="right" style="margin-top:8px"><button class="outline small" style="padding:8px" onclick="filterBy('all')">全部</button><button class="outline small" style="padding:8px" onclick="filterBy('todo')">未盘</button><button class="outline small" style="padding:8px" onclick="filterBy('done')">已盘</button></div><div class="list" id="itemList"></div></div><div class="panel" id="editor"><div class="muted">请选择商品开始盘点。</div></div></div><div class="tiny muted" style="margin:15px 3px">照片仅保存在私有空间。未盘商品导出为 0，但在盘点明细中明确标记「未盘」，与确认无货区分。</div></div>
<div id="toast" class="msg hidden"></div><input id="camera" type="file" accept="image/*" capture="environment" class="hidden" onchange="pickedPhoto(this)"><input id="gallery" type="file" accept="image/*" class="hidden" onchange="pickedPhoto(this)">
<script>
'use strict';
const API_BASE='https://oiytsycjzshksuoyjqxd.supabase.co/functions/v1/jft-fresh-count';
var state=null,current=null,cred='',filter='all',queuedFile=null,queuedPreview='',thumbUrls={},busy=false;
var $=id=>document.getElementById(id);
function esc(v){return String(v===null||v===undefined?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function notify(s){var x=$('toast');x.textContent=s;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),3900);}
function setBusy(v){busy=v;document.querySelectorAll('button').forEach(b=>b.disabled=v);}
async function api(action,body,method){
 var opts={method:method||'POST',headers:{'X-JFT-Pin':cred}};
 if(body instanceof FormData){opts.body=body;}
 else if(opts.method==='POST'){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body||{});}
 var aparts=action.split('&');var r=await fetch(API_BASE+'?action='+encodeURIComponent(aparts[0])+(aparts.length>1?'&'+aparts.slice(1).join('&'):''),opts);
 var type=r.headers.get('Content-Type')||'';
 var v=type.includes('application/json')?await r.json():await r.text();
 if(!r.ok)throw Error(v&&v.error?v.error:'网络请求失败：'+r.status);
 return v;
}
async function login(){
 cred=$('pin').value.trim();$('loginError').classList.add('hidden');if(!cred)return notify('请输入口令');
 try{setBusy(true);await loadState();sessionStorage.setItem('jft_fresh_pin',cred);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('changePinBtn').classList.remove('hidden');}catch(e){$('loginError').textContent=e.message;$('loginError').classList.remove('hidden');}finally{setBusy(false);}
}
async function changePin(){var n=prompt('请输入新的仓库口令（至少 12 个字符）');if(n===null)return;if(n.length<12)return notify('口令至少 12 个字符');var n2=prompt('再次输入新口令以确认');if(n!==n2)return notify('两次输入不一致');try{setBusy(true);await api('change-pin',{newPin:n});cred=n;sessionStorage.setItem('jft_fresh_pin',n);notify('新口令已生效');}catch(e){notify(e.message);}finally{setBusy(false);}}
function logout(){sessionStorage.removeItem('jft_fresh_pin');cred='';state=null;document.querySelectorAll('.thumb img').forEach(i=>i.src='');$('app').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');$('changePinBtn').classList.add('hidden');$('pin').value='';}
async function loadState(batch){state=await api('state'+(batch?'&batch='+encodeURIComponent(batch):''),null,'GET');render();}
async function reloadState(){try{setBusy(true);await loadState(state&&state.batch?state.batch.id:null);notify('数据已刷新');}catch(e){notify(e.message);}finally{setBusy(false);}}
function getCount(id){return (state.counts||[]).find(c=>Number(c.item_id)===Number(id));}
function getPhotos(id){return (state.photos||[]).filter(p=>Number(p.item_id)===Number(id));}
function readOnly(){return !state.batch||state.batch.status!=='active';}
function render(){
 var b=state.batch,done=state.counts.length,total=state.items.length,z=state.counts.filter(c=>c.zero).length,p=state.photos.length;
 $('sessionTitle').textContent=b?'盘点：'+b.count_date:'尚未开始盘点';
 $('sessionSub').textContent=b?('Rep: '+b.rep+' · '+(b.status==='active'?'进行中':'历史记录 / 只读')):'先创建一轮盘点，之后就能保存数量及照片';
 $('headerInfo').textContent=b?b.count_date+' · '+b.rep:'独立盘点 · 不修改原表';
 $('stats').innerHTML='<div class="stat"><b>'+done+'</b><span class="tiny muted">已盘</span></div><div class="stat"><b>'+(total-done)+'</b><span class="tiny muted">未盘</span></div><div class="stat"><b>'+z+'</b><span class="tiny muted">确认无货</span></div><div class="stat"><b>'+p+'</b><span class="tiny muted">照片数</span></div>';
 $('progress').style.width=(total?Math.round(done/total*100):0)+'%';
 $('startPanel').classList.toggle('hidden',!!b);
 var hs=state.history||[],val=b?b.id:'';
 $('batchHistory').innerHTML='<option value="">当前进行中 / 最新</option>'+hs.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===val?'selected':'')+'>'+esc(x.count_date+' '+x.rep+' '+(x.status==='active'?'●进行中':'✓历史'))+'</option>').join('');
 renderList();
 if(b){if(!state.items.some(x=>Number(x.id)===Number(current)))current=(state.items.find(x=>!getCount(x.id))||state.items[0]||{}).id;showItem(current);}
 else{$('editor').innerHTML='<h3>开始盘点</h3><p>点击上方「开始第一轮盘点」，填写 Rep，再选择商品。</p>';}
}
function norm(s){return String(s||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\s\-_\/().]/g,'');}
function distance(a,b){if(Math.abs(a.length-b.length)>3||a.length>25||b.length>25)return 99;var v=Array.from({length:b.length+1},(_,i)=>i);for(var i=1;i<=a.length;i++){var prev=v[0];v[0]=i;for(var j=1;j<=b.length;j++){var t=v[j];v[j]=Math.min(v[j]+1,v[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t;}}return v[b.length];}
var aliasMap=[['牛油果','avocado'],['青椒','greenpepper'],['红椒','redpepper'],['黄椒','yellowpepper'],['黄瓜','cucumber'],['西兰花','broccoli'],['花菜','cauliflower'],['菜花','cauliflower'],['生菜','lettuce,romaine,iceberg,greenleaf'],['洋葱','onion'],['大葱','greenonion'],['青葱','greenonion'],['蘑菇','mushroom'],['白菇','whitemushroom'],['金针菇','enokimushroom'],['胡萝卜','carrot'],['白萝卜','radish'],['白菜','nappa,bokchoy,cabbage'],['芹菜','celery'],['番茄','tomato'],['西红柿','tomato'],['辣椒','pepper,chili,habanero,jalapeno'],['蒜','garlic'],['姜','ginger'],['香菜','cilantro,coriander'],['九层塔','basil'],['罗勒','basil'],['菠菜','spinach'],['豆芽','beansprout'],['豆角','bean'],['土豆','potato'],['红薯','yam,sweetpotato'],['茄子','eggplant'],['韭菜','chive'],['芥兰','chinesebroccoli'],['莴笋','achoy'],['荷兰豆','snowpea'],['高丽菜','cabbage'],['油麦菜','achoy'],['玉米','corn'],['黄心菜','choysum']];
function rankItem(it,query){
 var s=norm(it.name+' '+it.pack+' '+it.unit),q=norm(query);if(!q)return 1;if(s.includes(q))return 500-q.length;
 for(var z of aliasMap){if(q===norm(z[0])||q.includes(norm(z[0]))){if(z[1].split(',').some(a=>s.includes(norm(a))))return 400;}}
 var chunks=(it.name+' '+it.pack).toLowerCase().split(/[\s/_().]+/);
 var best=99;for(var w of chunks){var t=norm(w);if(t.startsWith(q))return 300;if(q.length>=4)best=Math.min(best,distance(t,q));}
 return q.length>=4&&best<=2?120-best*10:-1;
}
function filterBy(f){filter=f;renderList();}
function renderList(){
 if(!state)return;var q=$('search').value.trim();
 var ls=state.items.map(x=>({it:x,score:rankItem(x,q)})).filter(x=>x.score>=0&&(filter==='all'||(filter==='done'?!!getCount(x.it.id):!getCount(x.it.id))));
 if(q)ls.sort((a,b)=>b.score-a.score||(a.it.source_order||a.it.id)-(b.it.source_order||b.it.id));
 $('itemTotal').textContent=ls.length+' / '+state.items.length;
 $('itemList').innerHTML=ls.map(x=>{var it=x.it,c=getCount(it.id),p=getPhotos(it.id),stamp=c?(c.zero?'<span class="stamp zero">0 库存</span>':'<span class="stamp done">已盘'+(p.length?' 📷':'')+'</span>'):'<span class="stamp">未盘</span>';
 return '<button class="entry '+(Number(current)===Number(it.id)?'active':'')+'" onclick="showItem('+it.id+')"><span><strong>'+esc(it.name)+'</strong><small>'+esc(it.pack+' / '+it.unit)+'</small></span>'+stamp+'</button>'}).join('')||'<p class="muted small">没有匹配项，请换一个关键词</p>';
}
function nextUncounted(){var all=state.items;var i=all.findIndex(x=>Number(x.id)===Number(current));return all.slice(i+1).concat(all.slice(0,i+1)).find(x=>!getCount(x.id));}
function selectedValue(id,def){var el=$(id);return el?el.value:def;}
function showItem(id){
 current=id;queuedFile=null;if(queuedPreview){URL.revokeObjectURL(queuedPreview);queuedPreview='';}
 var it=state.items.find(x=>Number(x.id)===Number(id)),c=getCount(id),ps=getPhotos(id),ro=readOnly();
 if(!it){$('editor').innerHTML='<p>没有选中商品</p>';return;}
 var fmt=(x)=>x===null||x===undefined?'':String(x);
 $('editor').innerHTML=
 '<div class="headrow"><span class="pill">表格第 '+esc(it.source_order||it.id)+' 行</span><span class="tiny muted">'+(c?'✓ 已保存':'○ 尚未盘点')+'</span></div>'+
 '<div class="cardtitle">'+esc(it.name)+'</div><div class="desc">Packing Style: <b>'+esc(it.pack||'—')+'</b>　单位: <b>'+esc(it.unit||'CS')+'</b></div>'+
 (ro?'<div class="alert">该轮盘点是历史记录，只能查看与导出。</div>':'')+
 '<div class="flex"><b>等级或批次与最终数量</b><span class="tiny muted">可填 No.1 / No.2 / No.3 或批次；数量填最终总数</span></div>'+
 '<div class="inputrow" style="margin-top:11px"><div><label>等级或批次 1</label><input id="g1" value="'+esc(c?c.grade1:'No.1')+'" '+(ro?'disabled':'')+'></div><div><label>数量</label><input id="q1" inputmode="decimal" type="number" step=".001" min="0" value="'+esc(c?fmt(c.qty1):'')+'" '+(ro?'disabled':'')+'></div><div><label>单位</label><input id="u1" value="'+esc(c?c.unit1:it.unit)+'" '+(ro?'disabled':'')+'></div></div>'+
 '<div class="inputrow" style="margin-top:11px"><div><label>等级或批次 2</label><input id="g2" value="'+esc(c?c.grade2:'No.2')+'" '+(ro?'disabled':'')+'></div><div><label>数量</label><input id="q2" inputmode="decimal" type="number" step=".001" min="0" placeholder="可不填" value="'+esc(c&&Number(c.qty2)>0?fmt(c.qty2):'')+'" '+(ro?'disabled':'')+'></div><div><label>单位</label><input id="u2" value="'+esc(c?c.unit2:it.unit)+'" '+(ro?'disabled':'')+'></div></div>'+
 '<div class="inputrow" style="margin-top:11px"><div><label>等级或批次 3</label><input id="g3" placeholder="可选：No.3 / 批次号" value="'+esc(c?c.grade3||'':'')+'" '+(ro?'disabled':'')+'></div><div><label>数量</label><input id="q3" inputmode="decimal" type="number" step=".001" min="0" placeholder="可不填" value="'+esc(c&&Number(c.qty3)>0?fmt(c.qty3):'')+'" '+(ro?'disabled':'')+'></div><div><label>单位</label><input id="u3" value="'+esc(c?c.unit3||it.unit:it.unit)+'" '+(ro?'disabled':'')+'></div></div>'+
 '<div class="foto"><div class="camera">📷</div><b>当前商品照片</b><p class="muted tiny" style="margin:5px 0">有库存至少 1 张，最多 3 张；自动压缩上传</p>'+
 (ro?'':'<div class="links"><button class="outline" onclick="openCamera()">拍照</button><button class="outline" onclick="$(\'gallery\').click()">从相册选择</button></div>')+
 '<div id="queued" class="tiny"></div><div class="thumbnails" id="photos"></div></div>'+
 '<div class="actions">'+(ro?'':'<button class="primary" onclick="saveCurrent(false)">💾 保存并下一项</button><button class="warn" onclick="saveCurrent(true)">无库存 0</button>')+'<button class="outline" onclick="jumpNext()">跳过 / 下一项</button></div>';
 loadThumbs(ps,ro);
 renderList();
}
async function loadThumbs(ps,ro){
 var target=$('photos');if(!target)return;
 target.innerHTML=ps.length?'':'<span class="muted tiny">尚无照片</span>';
 for(var p of ps){
  var node=document.createElement('div');node.className='thumb';node.innerHTML='<div class="photo-label">'+esc(p.grade||'货物照片')+'</div><img alt="商品实拍" loading="lazy"><div>'+(!ro?'<button class="danger" onclick="deletePhoto(\''+p.id+'\')">删除重拍</button>':'')+'</div>';
  target.appendChild(node);
  try{node.querySelector('img').src=await imageBlobUrl(p.id);}catch(e){node.querySelector('img').alt='照片读取失败';}
 }
}
async function imageBlobUrl(id){if(thumbUrls[id])return thumbUrls[id];var r=await fetch(API_BASE+'?action=image&id='+encodeURIComponent(id),{headers:{'X-JFT-Pin':cred}});if(!r.ok)throw Error('照片无法加载');return thumbUrls[id]=URL.createObjectURL(await r.blob());}
function openCamera(){$('camera').click();}
async function pickedPhoto(input){
 var f=input.files&&input.files[0];input.value='';if(!f)return;
 try{setBusy(true);queuedFile=await compress(f);if(queuedPreview)URL.revokeObjectURL(queuedPreview);queuedPreview=URL.createObjectURL(queuedFile);
 $('queued').innerHTML='<div style="margin-top:10px"><img src="'+esc(queuedPreview)+'" style="max-width:160px;max-height:125px;border-radius:8px"><p>✅ 照片已准备，保存商品时上传 ('+Math.round(queuedFile.size/1024)+'KB)</p></div>';
 }catch(e){notify('图片处理失败：'+e.message);}finally{setBusy(false);}
}
async function compress(file){return new Promise((resolve,reject)=>{

function pdfRound(ctx,x,y,w,h,r,fill,stroke){

 ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
 ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
 if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function pdfFit(ctx,text,width){

 while(text.length>1&&ctx.measureText(text+'…').width>width)text=text.slice(0,-1);
 return text+'…';
}
function pdfLines(ctx,text,width,limit){
 text=String(text||'').trim();var lines=[],line='';
 for(var ch of text){
  if(ctx.measureText(line+ch).width>width&&line){lines.push(line);line=ch;}
  else line+=ch;
 }
 if(line)lines.push(line);
 if(lines.length>limit){lines=lines.slice(0,limit);lines[limit-1]=pdfFit(ctx,lines[limit-1]+'…',width);}
 return lines.length?lines:['—'];
}

  if(!c)ctx.fillStyle='#f4f4f4';
  else if(confirmed)ctx.fillStyle='#fff5ed';
  ctx.fillRect(26,y,764,rowH);
  ctx.strokeStyle='#e1eae4';ctx.lineWidth=.5;ctx.beginPath();ctx.moveTo(26,y+rowH);ctx.lineTo(790,y+rowH);ctx.stroke();
  const itemName=item.name+(c?'':' [未盘]');
  ctx.font='bold 11.4px Arial, "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='#173629';
  ctx.fillText(pdfFit(ctx,itemName,widths[0]-9),starts[0]+4,y+16);
  for(let k=1;k<=3;k++){
   const pos=1+(k-1)*2;
   const grade=c&&qty[k-1]>0?(c['grade'+k]||'—'):'';
   const amount=(!c&&k===1)?'0':(c&&qty[k-1]>0)?String(qty[k-1])+' '+(c['unit'+k]||item.unit||'CS'):(confirmed&&k===1?'0':(c&&qty.every(n=>n===0)&&k===1?'0':''));
   ctx.font='11px Arial, "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='#334a3c';
   ctx.fillText(pdfFit(ctx,grade,widths[pos]-8),starts[pos]+4,y+16);
   ctx.font='bold 11px Arial, sans-serif';ctx.fillStyle='#103f2b';
   ctx.fillText(pdfFit(ctx,amount,widths[pos+1]-7),starts[pos+1]+4,y+16);
  }
 }
 ctx.strokeStyle='#c6d9cd';ctx.lineWidth=1;ctx.strokeRect(26,top,764,headH+rows.length*rowH);
 ctx.fillStyle='#506e5b';ctx.font='11px Arial, "PingFang SC",sans-serif';
 ctx.fillText('Items: '+state.items.length+'  |  Counted: '+state.counts.length+'  |  Uncounted: '+(state.items.length-state.counts.length)+'  |  Orange = confirmed zero',26,1040);
 ctx.textAlign='right';ctx.font='bold 11px Arial,sans-serif';
 ctx.fillText('Page '+(index+1)+' / '+total,790,1040);ctx.textAlign='left';
 const blob=await new Promise((res,rej)=>canvas.toBlob(b=>b?res(b):rej(Error('无法生成表格页')),'image/jpeg',.82));
 const data=new Uint8Array(await blob.arrayBuffer());
 canvas.width=1;canvas.height=1;
 return {bytes:data,width:Math.round(W*mult),height:Math.round(H*mult),failed:0};
}
async function exportInventoryPDF(tableOnly){
 if(busy||!checkExport())return;
 const pages=[],summaryChunks=[],photoChunks=[];
 for(let i=0;i<state.items.length;i+=34)summaryChunks.push(state.items.slice(i,i+34));
 if(!tableOnly)for(let i=0;i<state.items.length;i+=12)photoChunks.push(state.items.slice(i,i+12));
 const total=summaryChunks.length+photoChunks.length;
 try{
  setBusy(true);let missingPhotos=0;
  notify('PDF 正在生成：0 / '+total+' 页');
  for(let p=0;p<summaryChunks.length;p++){
   pages.push(await pdfTablePage(summaryChunks[p],p,total));
   notify('PDF 正在生成：'+pages.length+' / '+total+' 页');
   await new Promise(r=>setTimeout(r,0));
  }
  for(let p=0;p<photoChunks.length;p++){
   const pg=await pdfRasterPage(photoChunks[p],p,photoChunks.length,summaryChunks.length,total);
   missingPhotos+=pg.failed;pages.push(pg);
   notify('PDF 正在生成：'+pages.length+' / '+total+' 页');
   await new Promise(r=>setTimeout(r,0));
  }
  const pdf=pdfAssemble(pages);
  downloadBlob(pdf,'JFT_Fresh_'+(tableOnly?'Table':'Summary_and_Photos')+'_'+state.batch.count_date+'.pdf');
  notify('PDF 已导出：'+total+' 页'+(missingPhotos?'；有 '+missingPhotos+' 张照片读取失败':''));
 }catch(e){notify('PDF 导出失败：'+e.message);console.error('JFT PDF export',e);}
 finally{pages.length=0;setBusy(false);}
}
async function exportPDF(){return exportInventoryPDF(false);}
async function exportTablePDF(){return exportInventoryPDF(true);}
